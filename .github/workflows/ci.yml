name: Validate Lutli
on:
  push:
    branches: [main, planning/lutli]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    name: Portable Swift core
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: swift:6.1.3-noble
    steps:
      - uses: actions/checkout@v5
      - name: Run core tests
        run: swift test --parallel --jobs 4
  ios:
    name: iOS simulator build and rendering tests
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate Xcode project
        run: ./scripts/ios-bootstrap.sh
      - name: Select an available iPhone simulator
        id: simulator
        run: |
          device_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); ids=[v["udid"] for k,vs in d["devices"].items() if "iOS" in k for v in vs if v.get("isAvailable") and "iPhone" in v["name"]]; assert ids,"No available iPhone simulator"; print(ids[0])')
          echo "id=$device_id" >> "$GITHUB_OUTPUT"
      - name: Build and run iOS integration tests
        run: |
          mkdir -p .build
          set +e
          set -o pipefail
          xcodebuild test \
            -project ios/Lutli.xcodeproj \
            -scheme Lutli \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -derivedDataPath .build/ios-derived-data \
            -resultBundlePath .build/LutliTests.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee .build/xcodebuild.log
          build_status=${PIPESTATUS[0]}
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('.build/xcodebuild.log').read_text(errors='replace').splitlines()
          results = [line for line in lines if ('Executed ' in line and 'test' in line) or ('Test case ' in line and (' passed ' in line or ' failed ' in line))]
          if results:
              summary = '\n'.join(results)[-12000:]
              escaped = summary.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print(f'::notice title=iOS test results::{escaped}')
          PY
          if [ "$build_status" -ne 0 ]; then
            python3 - <<'PY'
          from pathlib import Path
          lines = Path('.build/xcodebuild.log').read_text(errors='replace').splitlines()
          failures = [line for line in lines if any(marker in line.lower() for marker in ['error:', 'fatal error', 'testing failed', 'failed to build'])]
          message = '\n'.join(failures or lines[-40:])[:12000]
          escaped = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Xcode build or test failure::{escaped}')
          PY
          fi
          exit "$build_status"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ios-test-results
          path: |
            .build/LutliTests.xcresult
            .build/xcodebuild.log
          if-no-files-found: ignore
